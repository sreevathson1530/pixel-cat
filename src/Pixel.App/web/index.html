<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
  <title>Pixel</title>
  <link rel="stylesheet" href="vendor/hljs-dark.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="drag">
    <img class="avatar" id="avatar" alt="">
    <div class="who">
      <div class="name">Pixel</div>
      <div class="status" id="status">here for you</div>
    </div>
    <button class="icon" id="newChat" title="New chat" aria-label="New chat">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <button class="icon" id="close" title="Hide (Esc)" aria-label="Hide chat">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>

  <main id="log" aria-live="polite">
    <section class="empty" id="empty">
      <p class="hello">Mrrp! I'm <b>Pixel</b>.</p>
      <p class="sub">Ask me anything — I can read what's on your screen.</p>
      <div class="chips">
        <button class="chip">Explain what's on my screen</button>
        <button class="chip">What does this error mean?</button>
        <button class="chip">Summarise this page</button>
      </div>
    </section>
  </main>

  <footer class="composer">
    <div class="context">
      <button class="eye on" id="eye" title="Include what's on screen" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
      </button>
      <span class="seeing" id="seeing">Reading your screen</span>
    </div>
    <div class="input">
      <textarea id="text" rows="1" placeholder="Ask about your screen…" spellcheck="true"></textarea>
      <button class="send" id="send" title="Send (Enter)" aria-label="Send">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5"/></svg>
      </button>
    </div>
  </footer>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
